[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "b102-recommendation"
version = "0.1.0"
description = "B102 recommendation API, batch, and evaluation package"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9"]

[project.scripts]
b102-recommendation = "recommendation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recommendation"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

