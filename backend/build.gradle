plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	springdocVersion = '2.9.1'
}

dependencies {
	// Web / API
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// Security — 모두 Spring Boot 관리 버전 (build.gradle 에서 버전을 덮어쓰지 않는다)
	//   oauth2-client        : 카카오·Google 인가 코드 교환·프로필 조회 (API_SPEC §2). ClientRegistration 은 인증 담당이 application.yml 에 연결
	//   oauth2-resource-server: Authorization: Bearer <JWT> 검증 필터. 서비스 JWT 는 HS256 24h (API_SPEC §2.2)
	//   두 스타터가 끌어오는 spring-security-oauth2-jose(Nimbus) 로 JWT 발급(NimbusJwtEncoder)·검증(NimbusJwtDecoder) — jjwt 등 별도 라이브러리 불필요
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// PostgreSQL + JPA + Flyway
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// Elasticsearch (Spring Data Elasticsearch 5.5.x / ES client 8.18.x)
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
}

// bootRun 이 Gradle 데몬의 기본 인코딩(Windows 한글 로캘 = MS949)을 앱 JVM 에 물려주는 것을 막는다. 운영 컨테이너와 같은 UTF-8 로 고정.
tasks.named('bootRun') {
	jvmArgs '-Dfile.encoding=UTF-8'
}
