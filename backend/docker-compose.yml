# 로컬 개발용 인프라. 앱은 IDE 나 ./gradlew bootRun 으로 따로 띄운다.
#   docker compose up -d
#   docker compose down -v   # 데이터까지 초기화
name: brbbr

services:
  postgres:
    image: postgres:16.15
    container_name: b102-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookdb}
      POSTGRES_USER: ${POSTGRES_USER:-book}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-book}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # 호스트에 다른 PG 가 5432 를 쓰면 .env 에서 POSTGRES_PORT 변경
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-book} -d ${POSTGRES_DB:-bookdb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    build: ./docker/elasticsearch
    image: b102/elasticsearch-nori:8.19.21
    container_name: b102-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"      # 로컬 전용. 운영은 켠다.
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  esdata:
