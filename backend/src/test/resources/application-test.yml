# 테스트 프로필. DB·ES 접속은 CI(scripts/ci/run-backend-ci.sh) 가 DB_URL 등 환경변수로 넘긴다.
# 로컬은 deploy 로컬 스택(15432) 을 쓰려면: DB_URL=jdbc:postgresql://localhost:15432/bookdb DB_PASSWORD=<.env.local> ./gradlew test
spring:
  datasource:
    hikari:
      # 테스트는 Spring 컨텍스트가 여러 개 뜬다(@MockitoSpyBean 등 → 컨텍스트마다 풀 하나). 기본 10개씩 잡으면
      # CI PG(max_connections=40, superuser 예약 3)를 넘칠 수 있어 컨텍스트당 2개로 제한한다.
      maximum-pool-size: 2
      minimum-idle: 1

app:
  frontend-origin: http://localhost:5173
  search:
    alias: books_test            # 로컬 스택의 books 인덱스와 섞이지 않게 분리. CI 는 매번 새 ES 라 무관
    index-name: books_test_v4         # 매핑 버전. 로컬 ES 에 옛 books_test_v3 가 남아 있으면 SearchTestSupport 가 재색인해 맞춘다
    index-on-start: NEVER        # 색인은 테스트가 직접 부른다. 백그라운드 색인이 다른 테스트의 정리와 겹치지 않게
  jwt:
    secret: test-only-secret-not-for-production-0123456789abcdef
    ttl-seconds: 3600
  oauth:
    redirect-base-url: ""
    kakao:
      client-id: test-kakao-client-id
      client-secret: test-kakao-client-secret
    google:
      client-id: test-google-client-id
      client-secret: test-google-client-secret

logging:
  level:
    root: WARN
    com.ssafy.b102: INFO
