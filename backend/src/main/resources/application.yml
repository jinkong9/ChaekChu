spring:
  application:
    name: backend
  config:
    import: optional:file:.env[.properties]   # backend/.env 가 있으면 읽는다 (KEY=VALUE). 없어도 기동.

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookdb}
    username: ${DB_USERNAME:book}
    password: ${DB_PASSWORD:book}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway 가 관리한다. Hibernate 가 DDL 을 만들지 않는다.
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc.time_zone: UTC       # 저장은 UTC, 표시는 클라이언트에서 Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}          # 로컬(xpack 꺼짐)은 비움. 운영은 elastic
    password: ${ES_PASSWORD:}
    connection-timeout: 5s
    socket-timeout: 30s

  jackson:
    time-zone: UTC
    default-property-inclusion: always   # 명세 타입이 `string | null` — null 도 키를 내보낸다 (프론트 타입과 1:1)

  http:
    client:
      connect-timeout: 5s               # 카카오·Google 토큰 교환용 RestClient.Builder
      read-timeout: 10s

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework   # Nginx 뒤에서 X-Forwarded-* 반영
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness, /actuator/health/readiness

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.ssafy.b102: ${LOG_LEVEL_APP:DEBUG}   # 운영은 compose 에서 INFO

# ── 서비스 설정 (API_SPEC §2) ──
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}   # OAuth 콜백 후 302 목적지. {origin}/oauth/callback#accessToken=…
  jwt:
    secret: ${JWT_SECRET:}                                    # HS256 비밀키 32바이트 이상. 비면 기동 실패 (openssl rand -base64 48)
    ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:86400}              # 24시간 고정, 갱신 토큰 없음 (명세 §2.2)
  oauth:
    redirect-base-url: ${OAUTH_REDIRECT_BASE_URL:}            # 비면 요청 origin 으로 콜백 주소를 만든다. nginx 뒤 문제 시 https://도메인 지정
    kakao:
      client-id: ${OAUTH_KAKAO_CLIENT_ID:}                    # 콘솔 앱 → 플랫폼 키 → REST API 키
      client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}            # 같은 화면의 클라이언트 시크릿
      authorization-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me        # id(회원번호)만 사용 — 동의 항목 불필요
      scopes: []
    google:
      client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://openidconnect.googleapis.com/v1/userinfo   # sub 만 사용
      scopes: [openid]
  search:                                                       # 도서 검색 인덱스 (API_SPEC §4.1). 매핑 = resources/elasticsearch/books_v1-*.json
    alias: ${SEARCH_INDEX_ALIAS:books}                          # 코드는 항상 alias 로 읽고 쓴다
    index-name: ${SEARCH_INDEX_NAME:books_v1}                   # 처음 만들 물리 인덱스. 재색인은 v2 를 만들어 채운 뒤 alias 만 옮긴다
    create-index-on-start: ${SEARCH_CREATE_INDEX_ON_START:true} # 기동 시 alias 가 없으면 생성. ES 가 죽어 있으면 경고만 남기고 기동은 계속
    index-on-start: ${SEARCH_INDEX_ON_START:IF_CREATED}         # PG books → ES 전체 색인(백그라운드). NEVER / IF_CREATED(alias 를 새로 만든 기동만) / ALWAYS
