# =====================================================================
# 배포용 compose — EC2 (T3.xlarge 16GiB) 한 대. 로컬 개발은 backend/docker-compose.yml 을 쓴다.
#   서버:  cd ~/S15P21B102 && docker compose -f deploy/docker-compose.yml up -d --build --wait
#   .env:  deploy/.env (deploy/.env.example 참고, chmod 600, 커밋 금지)
#
# 메모리 상한 (16GiB 서버)
#   web 128m · backend 1.5g · postgres 3g · elasticsearch 4g(힙 2g)   = 기본 8.6g
#   qdrant 3g (--profile recsys)                                     = 켜면 11.6g
#   여기에 수집기 systemd 상한 3g 와 (도입 후) Jenkins 1~1.5g 가 더해진다. Qdrant 를 켜기 전에 수집기 상한을 내린다.
#   CPU 상한은 걸지 않는다. 수집기와 함께 실측한 뒤 필요하면 추가.
# 외부 노출은 web 의 80/443 만. 나머지는 127.0.0.1 에만 바인딩한다.
# =====================================================================
name: brbbr

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_ENABLE_MSW: "false"
    image: b102-web:${RELEASE:-latest}
    container_name: b102-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN 필요}
      TLS_ENABLED: ${TLS_ENABLED:-false}     # 인증서 발급 전 false → 발급 후 true 로 바꾸고 재기동
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # /gitlab-webhook/post → 호스트 Jenkins
    depends_on:
      - backend
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ../backend
    image: b102-backend:${RELEASE:-latest}
    container_name: b102-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"           # 호스트에서 헬스체크·디버그용. 외부 공개 아님
    environment:
      SERVER_PORT: "8080"
      AI_RECOMMENDATION_URL: http://ai:${AI_PORT:-8000}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bookdb}
      DB_USERNAME: ${POSTGRES_USER:-book}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      ES_URIS: http://elasticsearch:9200
      ES_USERNAME: elastic
      ES_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD 필요}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-86400}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-1209600}
      OAUTH_KAKAO_CLIENT_ID: ${OAUTH_KAKAO_CLIENT_ID:-}
      OAUTH_KAKAO_CLIENT_SECRET: ${OAUTH_KAKAO_CLIENT_SECRET:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      FRONTEND_ORIGIN: https://${DOMAIN}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      ALADIN_TTB_KEY: ${ALADIN_TTB_KEY:-}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    mem_limit: 1536m
    stop_grace_period: 30s               # Spring graceful shutdown 이 요청을 끝낼 시간 (compose 기본 10s)
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  ai:
    build:
      context: ../ai
    image: b102-ai:${RELEASE:-latest}
    container_name: b102-ai
    restart: unless-stopped
    environment:
      AI_PORT: ${AI_PORT:-8000}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-info}
      AI_MODEL_VERSION: ${AI_MODEL_VERSION:-d4l-hybrid-v1}
      AI_INDEX_VERSION: ${AI_INDEX_VERSION:-none}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-books_active}
      QDRANT_TAG_COLLECTION: ${QDRANT_TAG_COLLECTION:-}
      QDRANT_VECTOR_NAME: ${QDRANT_VECTOR_NAME:-}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-2.0}
      TZ: UTC
    expose:
      - "${AI_PORT:-8000}"
    mem_limit: 1g
    depends_on:
      qdrant:
        condition: service_started
        required: false
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${AI_PORT:-8000}/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16.15
    container_name: b102-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"   # psql·pg_dump·수집기 적재용. 외부 공개 아님
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookdb}
      POSTGRES_USER: ${POSTGRES_USER:-book}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=50
      - -c
      - log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 3g
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-book} -d ${POSTGRES_DB:-bookdb}"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    build:
      context: ../backend/docker/elasticsearch
    image: b102-elasticsearch-nori:8.19.21
    container_name: b102-elasticsearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"            # 색인 스크립트·Kibana 없음. 외부 공개 아님
    environment:
      discovery.type: single-node
      cluster.name: b102
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"   # 컨테이너 네트워크 내부 통신. TLS 는 nginx 에서 종단
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD 필요}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms2g -Xmx2g}
      bootstrap.memory_lock: "true"
      TZ: UTC
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - esdata:/usr/share/elasticsearch/data
    mem_limit: 4g
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$$ELASTIC_PASSWORD http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  qdrant:
    profiles: ["recsys"]                 # 추천 담당이 붙일 때: docker compose --profile recsys up -d
    image: qdrant/qdrant:v1.18.3
    container_name: b102-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY 필요}
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
      TZ: UTC
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 3g
    logging: *default-logging

# 볼륨 이름은 고정한다. compose 프로젝트명(brbbr)이 바뀌어도 서버에 이미 있는 b102_* 볼륨(PG 데이터·ES 인덱스·인증서)을 그대로 쓴다.
# 스크립트(issue-cert.sh, renew-cert.sh)도 이 이름을 참조한다.
volumes:
  pgdata:
    name: b102_pgdata
  esdata:
    name: b102_esdata
  qdrant-data:
    name: b102_qdrant-data
  letsencrypt:
    name: b102_letsencrypt
  certbot-www:
    name: b102_certbot-www
