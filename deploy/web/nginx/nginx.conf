worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 백엔드 컨테이너 (compose 서비스명). DNS 재확인을 위해 resolver 사용
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 네이버 표지 프록시 캐시 (snippets/app.conf 의 /covers/naver/). 컨테이너 디스크라 재배포 때 비워지는데, 표지는 다시 받으면 되는 값이다.
    proxy_cache_path /var/cache/nginx/covers levels=1:2 keys_zone=covers:10m max_size=300m inactive=30d use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
