# 두 템플릿(http/tls)이 공유하는 라우팅. 여기만 고치면 둘 다 반영된다.

set $backend http://backend:8080;

# 숨김 파일 경로는 SPA 폴백 대신 404 (/.env, /.git 등 스캐너 차단). ACME 는 서버 블록에서 ^~ 로 먼저 잡힌다
location ~ /\.(?!well-known/) {
    access_log off;
    return 404;
}

# 헬스체크 (compose healthcheck 용, 외부에서도 200 만 돌려준다)
location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
    include /etc/nginx/snippets/security-headers.conf;
}

# API
location /api/ {
    proxy_pass $backend;
    include /etc/nginx/snippets/proxy.conf;
}

# OpenAPI 문서 (팀 내부용. 공개 서비스가 되면 막는다)
location /swagger-ui/ {
    proxy_pass $backend;
    include /etc/nginx/snippets/proxy.conf;
}
location = /swagger-ui.html {
    proxy_pass $backend;
    include /etc/nginx/snippets/proxy.conf;
}
location /v3/api-docs {
    proxy_pass $backend;
    include /etc/nginx/snippets/proxy.conf;
}

# GitLab 웹훅 → 호스트의 Jenkins(0.0.0.0:8080). POST 만. Jenkins UI 는 프록시하지 않는다 (SSH 터널로만).
# host.docker.internal 은 compose 의 extra_hosts(host-gateway) 로 /etc/hosts 에 들어온다. nginx 는 기동 시 해석한다.
location = /gitlab-webhook/post {
    limit_except POST { deny all; }
    client_max_body_size 1m;
    proxy_pass http://host.docker.internal:8080;
    include /etc/nginx/snippets/proxy.conf;
}

# actuator 는 외부 비공개. 헬스체크는 호스트에서 127.0.0.1:18080 으로 직접 본다.
location /actuator/ { return 404; }

# 정적 자산: 해시 파일명이라 장기 캐시
location /assets/ {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

# SPA
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
}
