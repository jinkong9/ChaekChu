# 두 템플릿(http/tls)이 공유하는 라우팅. 여기만 고치면 둘 다 반영된다.

set $backend http://backend:8080;

# 숨김 파일 경로는 SPA 폴백 대신 404 (/.env, /.git 등 스캐너 차단). ACME 는 서버 블록에서 ^~ 로 먼저 잡힌다
location ~ /\.(?!well-known/) {
    access_log off;
    return 404;
}

# 헬스체크 (compose healthcheck 용, 외부에서도 200 만 돌려준다)
location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
    include /etc/nginx/snippets/security-headers.conf;
}

# API
location /api/ {
    proxy_pass $backend;
    include /etc/nginx/snippets/proxy.conf;
}

# OpenAPI 문서 (팀 내부용. 공개 서비스가 되면 막는다)
location /swagger-ui/ {
    proxy_pass $backend;
    include /etc/nginx/snippets/proxy.conf;
}
location = /swagger-ui.html {
    proxy_pass $backend;
    include /etc/nginx/snippets/proxy.conf;
}
location /v3/api-docs {
    proxy_pass $backend;
    include /etc/nginx/snippets/proxy.conf;
}

# GitLab 웹훅 → 호스트의 Jenkins(0.0.0.0:8080). POST 만. Jenkins UI 는 프록시하지 않는다 (SSH 터널로만).
# host.docker.internal 은 compose 의 extra_hosts(host-gateway) 로 /etc/hosts 에 들어온다. nginx 는 기동 시 해석한다.
location = /gitlab-webhook/post {
    limit_except POST { deny all; }
    client_max_body_size 1m;
    proxy_pass http://host.docker.internal:8080;
    include /etc/nginx/snippets/proxy.conf;
}

# actuator 는 외부 비공개. 헬스체크는 호스트에서 127.0.0.1:18080 으로 직접 본다.
location /actuator/ { return 404; }

# 네이버 책 썸네일 표지 프록시. 네이버 CDN(bookthumb-phinf.pstatic.net)은 CORS 헤더를 주지 않아 홈 링의 WebGL 텍스처(fetch)가 막혔다(09-18).
# 우리 origin 으로 받아 주면 CORS 자체가 없다. 프론트는 adaptPopularSegments.ts 가 URL 의 호스트 부분만 이 경로로 바꾼다.
# 목적지 호스트는 여기 고정하고 GET 만 받는다 — ?url= 식으로 목적지를 받는 열린 프록시는 SSRF 통로가 된다.
# 알라딘·카카오 CDN 은 CORS 헤더를 주므로 프록시하지 않는다. 변수 + resolver 를 쓰는 이유는 $backend 와 같다(기동 시 DNS 실패로 nginx 가 안 뜨는 일 방지).
location ^~ /covers/naver/ {
    limit_except GET { deny all; }
    set $naver_cdn https://bookthumb-phinf.pstatic.net;
    rewrite ^/covers/naver/(.*)$ /$1 break;
    proxy_pass $naver_cdn;
    proxy_http_version 1.1;
    proxy_set_header Host          bookthumb-phinf.pstatic.net;
    proxy_set_header Connection    "";
    proxy_set_header Cookie        "";
    proxy_set_header Authorization "";
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_connect_timeout 5s;
    proxy_read_timeout    15s;

    # 표지는 바뀌지 않는 값이라 길게 캐시한다. 404 도 잠깐 기억해 없는 표지를 매번 네이버에 묻지 않는다.
    proxy_cache covers;
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1h;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header p3p;
    proxy_hide_header referrer-policy;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Cache-Status $upstream_cache_status;
    include /etc/nginx/snippets/security-headers.conf;
}

# 정적 자산: 해시 파일명이라 장기 캐시
location /assets/ {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

# SPA
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
}
